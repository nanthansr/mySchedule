<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="A learner profile of topic, pace and availability goes into a FastAPI matching service, which queries Postgres for overlapping windows and returns ranked partner matches. The whole stack runs from one docker-compose file, and GitHub Actions runs the test suite on every push before anything merges.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
<rect width="900" height="268" fill="#0d1117"/>
<rect x="0" y="8" width="900" height="150" rx="8" fill="#12171e"/>
<text x="16" y="28" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5a626b" letter-spacing="1.4">REQUEST</text>
<rect x="96" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="176.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Learner profile</text>
<text x="176.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">topic · pace · times</text>
<rect x="310" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="390.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">FastAPI</text>
<text x="390.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">matching service</text>
<rect x="524" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="604.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">PostgreSQL</text>
<text x="604.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">overlap query</text>
<rect x="738" y="42" width="110" height="46" rx="6" fill="#2b1d12" stroke="#6b4426" stroke-width="1"/>
<text x="793.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e8955a">Ranked pairs</text>
<text x="793.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">best fit first</text>
<rect x="96" y="200" width="374" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="283.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">docker-compose</text>
<text x="283.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">api + db + frontend, one command</text>
<rect x="524" y="200" width="324" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="686.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">GitHub Actions</text>
<text x="686.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">tests run on every push, before merge</text>
<path d="M 256 65 L 306 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 470 65 L 520 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 684 65 L 734 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 283 196 L 283 100" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
