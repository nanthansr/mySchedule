<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="A browser request reaches Nginx on the public application tier, which serves the React build and proxies API calls to a FastAPI container on the same EC2 instance. FastAPI talks to the data tier, which sits in a private subnet reachable only from the application tier security group. Both tiers are containerised and live inside one VPC, with security groups rather than open ports separating them.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
<rect width="900" height="268" fill="#0d1117"/>
<rect x="0" y="8" width="900" height="150" rx="8" fill="#12171e"/>
<text x="16" y="28" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5a626b" letter-spacing="1.4">REQUEST</text>
<rect x="96" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="176.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Browser</text>
<text x="176.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">public internet</text>
<rect x="310" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="390.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Nginx on EC2</text>
<text x="390.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">serves React, proxies /api</text>
<rect x="524" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="604.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">FastAPI container</text>
<text x="604.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">application tier</text>
<rect x="738" y="42" width="110" height="46" rx="6" fill="#2b1d12" stroke="#6b4426" stroke-width="1"/>
<text x="793.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e8955a">Data tier</text>
<text x="793.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">private subnet</text>
<rect x="96" y="200" width="374" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="283.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">One VPC</text>
<text x="283.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">public and private subnets, not one flat network</text>
<rect x="524" y="200" width="324" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="686.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Security groups</text>
<text x="686.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">the data tier accepts only the app tier</text>
<path d="M 256 65 L 306 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 470 65 L 520 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 684 65 L 734 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 283 196 L 283 100" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<path d="M 686 196 L 686 100" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<text x="291" y="150" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#9198a1">holds both tiers</text>
<text x="694" y="150" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#9198a1">no open ports between them</text>
</svg>