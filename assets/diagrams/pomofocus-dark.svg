<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Starting a session stores an end date rather than a countdown number. On every tick the menu bar ring is redrawn from the gap between now and that end date, so the ring ripens instead of digits ticking down, and the session ends when now passes the end date. Because the truth is a date and not a counter, closing the lid mid-session and reopening it later leaves the remaining time correct, where a decrementing counter would have drifted.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
<rect width="900" height="268" fill="#0d1117"/>
<rect x="0" y="8" width="900" height="150" rx="8" fill="#12171e"/>
<text x="16" y="28" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#5a626b" letter-spacing="1.4">SESSION</text>
<rect x="96" y="42" width="160" height="46" rx="6" fill="#2b1d12" stroke="#6b4426" stroke-width="1"/>
<text x="176.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e8955a">Start</text>
<text x="176.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">store an end date</text>
<rect x="310" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="390.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Every tick</text>
<text x="390.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">now vs end date</text>
<rect x="524" y="42" width="160" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="604.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Ring redraws</text>
<text x="604.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">no digits, ever</text>
<rect x="738" y="42" width="110" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="793.0" y="58.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Done</text>
<text x="793.0" y="72.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">now passes end</text>
<rect x="96" y="200" width="374" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="283.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Lid closes, app sleeps</text>
<text x="283.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">a decrementing counter would drift here</text>
<rect x="524" y="200" width="324" height="46" rx="6" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
<text x="686.0" y="216.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Swift, zero dependencies</text>
<text x="686.0" y="230.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" font-weight="400" fill="#9198a1">five tests, no network calls at all</text>
<path d="M 256 65 L 306 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 470 65 L 520 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 684 65 L 734 65" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M 283 196 L 283 100" stroke="#6e7681" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<text x="291" y="150" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#9198a1">the date is still true on wake</text>
<text x="524" y="258" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#9198a1"><tspan fill="#e8955a" font-weight="600">A visible countdown is itself a context switch</tspan> - you look at it, and the looking is the interruption.</text>
</svg>