name: Validate HTML

# Deployment is handled by GitHub Pages itself: the repo is named
# nanthansr.github.io and Pages serves the main branch root directly.
# What is and is not published is controlled by _config.yml.
# This workflow only checks the markup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches a hand-edit to index.html that drifted from data/*.json.
      # The generated sections are the ones a stale edit would silently break.
      - name: Check generated output matches data/
        run: python scripts/build-site.py --check

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          blacklist: docs
